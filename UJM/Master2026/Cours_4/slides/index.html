<!doctype html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Master 2026 · Slides</title>

	<link rel="stylesheet" href="dist/reset.css">
	<link rel="stylesheet" href="dist/reveal.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap">
	<link rel="stylesheet" href="../../style.css">
	<style>
		body { background: #fff; }
		.reveal { font: 400 32px/1.4 "IBM Plex Sans", sans-serif; color: #202122; }
		.reveal a { color: #0645ad; text-decoration: none; }
		.reveal a:hover { text-decoration: underline; }
		.reveal .controls, .reveal .progress { color: #202122; }
		.reveal .slide-number { background: transparent; color: #54595d; font-family: "IBM Plex Sans", sans-serif; }

		/* Titres en gros */
		.reveal h1, .reveal h2, .reveal h3 { margin: 0; line-height: 1.1; }
		.reveal h1 { font-size: 3.4em; font-weight: normal; }
		/* Doubles polices : le calque Resistance est décalé de --ombre-titre vers le haut-droite,
		   on agrandit la zone blanche du h1 pour qu'il ne sorte pas du fond (sinon blanc sur blanc) */
		.reveal h1, .reveal h1::after { padding: calc(var(--ombre-titre) + .15em) calc(var(--ombre-titre) + .1em) .15em; }
		.reveal h2 { font-size: 2.6em; font-weight: normal; }
		.reveal h3 { font-size: 2em; }

		/* Images */
		.reveal .images { display: flex; gap: 1em; justify-content: center; align-items: flex-start; }
		.reveal figure.image { flex: 1 1 0; margin: 0; padding: .3em; border: 2px dashed #a2a9b1; }
		.reveal figure.image img { display: block; width: 100%; max-height: 600px; object-fit: contain; margin: 0; }
		.reveal .images.trio figure.image img { max-height: 520px; }
		.reveal figure.image figcaption { margin-top: .4em; font-size: .45em; line-height: 1.3; color: #54595d; text-align: left; }

		/* Citations */
		.reveal figure.citation { margin: 0 auto; max-width: 90%; border-left: 3px solid #a2a9b1; padding-left: 1em; text-align: left; }
		.reveal figure.citation blockquote { margin: 0; font-style: italic; font-size: 1.1em; }
		.reveal figure.citation.long blockquote { font-size: .72em; }
		.reveal figure.citation figcaption { margin-top: .8em; font-size: .55em; color: #54595d; }
		.reveal figure.citation figcaption::before { content: "— "; }
	</style>
</head>

<body>
	<div class="reveal">
		<div class="slides">

			<section>
				<h1>Titre</h1>
			</section>

		</div>
	</div>

	<script src="dist/reveal.js"></script>
	<script src="plugin/notes/notes.js"></script>
	<script>
		// Même effet de titre que la page index (voir style.css)
		document.querySelectorAll('h1').forEach(h => h.dataset.text = h.textContent);

		Reveal.initialize({
			hash: true,
			width: 1200,
			height: 800,
			slideNumber: true,
			plugins: [RevealNotes]
		});
	</script>
</body>

</html>
